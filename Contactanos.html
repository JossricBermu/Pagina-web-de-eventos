        <main>
            <h2 style="text-align: center; font-size: 30px;">Contactanos</h2>
            <div style="justify-content: center; display: flex;">
                <form>
                    <div style="display: flex; flex-direction: column; gap: 16px; width: 150%; background: linear-gradient(to bottom, rgb(83, 184, 224), rgb(4, 221, 112)); padding: 20px; border-radius: 20px;"> 
                        <label style="font-size: 20px;" for="Nombre">Nombre</label>
                    <input style="height: 25px; border-radius: 20px ; padding-left: 15px;" type="text"id="nombre" placeholder="Ingresa tu nombre">
                    <label style="font-size: 20px;" for="Correo">Correo</label>
                    <input style="height: 25px; border-radius: 20px ; padding-left: 15px;" type="email" id="Correo" placeholder="Ingresa tu correo" >
                    <label style="font-size: 20px;" for="Celular">Celular</label>
                    <input style="height: 25px; border-radius: 20px ; padding-left: 15px;" type="number" id="Celular" placeholder="Ingresa su celular">
                    <label style="font-size: 20px;" for="Mensaje">Mensaje</label>
                    <textarea style=" border-radius: 20px ; padding-left: 15px;" name="Mensaje" id="Mensaje" placeholder="Escribe tu mensaje" rows="5"></textarea>
<button style="border-radius: 20px; background-color: rgb(255, 197, 4); height: 40px; font-size: 25px;">Enviar</button>
                    </div>
                    
                </form>
            </div>
